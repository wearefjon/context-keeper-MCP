[project]
name = "context-keeper-mcp"
version = "2.0.0"
description = "ContextKeeper 2.0 — Developer governance, runtime modernization, actor-critic review, and release engine for IBM Bob 2.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "filelock>=3.13",
    "pydantic>=2.0.0",
]

[project.scripts]
context-keeper-mcp = "context_keeper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_keeper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
